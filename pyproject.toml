[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ouncemcp"
version = "0.0.1.dev0"
description = "Build MCP servers and clients that are fast, low-noise, and safe for agents by default."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Subbusainath Rengasamy" }]
keywords = ["mcp", "model-context-protocol", "agents", "llm", "fastmcp"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
# FastMCP and the tokenizer are pinned exactly and rechecked each release (spec 6.2).
# FastMCP 4.1.6 brings the MCP Python SDK 2.3.0.
dependencies = [
  "fastmcp==4.1.8",
  "tiktoken==0.14.0",
  "pydantic>=2.11,<3",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
client = []
eval = ["pyyaml>=6"]
otel = ["opentelemetry-api>=1.28"]
ui = []
docs = ["mkdocs==1.6.1", "mkdocstrings==1.0.8", "mkdocstrings-python==2.0.11"]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "anyio>=4",
  "hypothesis>=6.100",
  "mypy>=1.10",
  "pyyaml>=6",
  "types-PyYAML",
  "opentelemetry-sdk>=1.28",
]

[project.scripts]
ouncemcp = "ouncemcp.cli:main"

[project.urls]
Repository = "https://github.com/subbusainath/ouncemcp"

[tool.hatch.build.targets.wheel]
packages = ["src/ouncemcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["*.md"]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
files = ["src/ouncemcp"]
ignore_missing_imports = true
