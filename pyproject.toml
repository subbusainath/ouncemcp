[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ouncemcp"
version = "1.0.0rc3"
description = "Build MCP servers and clients that are fast, low-noise, and safe for agents by default."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Subbusainath Rengasamy" }]
keywords = ["mcp", "model-context-protocol", "agents", "llm", "fastmcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
# FastMCP is a tested range within one major (proposal 0029): CI tests 4.1.6 from the
# lockfile and the newest 4.x release. The tokenizer is pinned exactly (spec 6.2).
dependencies = [
  "fastmcp>=4.1.6,<5",
  "tiktoken==0.14.0",
  "pydantic>=2.11,<3",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
client = []
eval = ["pyyaml>=6"]
otel = ["opentelemetry-api>=1.28"]
anthropic = ["anthropic>=2.3,<3"]
ui = []
docs = ["mkdocs==1.6.1", "mkdocs-material==9.8.1", "mkdocstrings==1.0.8", "mkdocstrings-python==2.0.11"]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "anyio>=4",
  "hypothesis>=6.100",
  "mypy>=1.10",
  "pyyaml>=6",
  "types-PyYAML",
  "opentelemetry-sdk>=1.28",
  "anthropic>=2.3,<3",
]

[project.scripts]
ouncemcp = "ouncemcp.cli:main"

[project.urls]
Homepage = "https://subbusainath.github.io/ouncemcp/"
Documentation = "https://subbusainath.github.io/ouncemcp/"
Repository = "https://github.com/subbusainath/ouncemcp"
Changelog = "https://github.com/subbusainath/ouncemcp/blob/main/CHANGELOG.md"
Issues = "https://github.com/subbusainath/ouncemcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ouncemcp"]

[tool.hatch.build.targets.sdist]
# Everything needed to build the package and run its tests, anchored to the root
# (patterns follow .gitignore rules). The report UI's node_modules stay out.
include = [
  "/src/ouncemcp",
  "/tests",
  "/examples",
  "/docs",
  "/benchmarks",
  "/conformance",
  "/ui/report",
  "/mkdocs.yml",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/SECURITY.md",
  "/CONTRIBUTING.md",
]
exclude = ["**/__pycache__", "/ui/report/node_modules"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["*.md"]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
files = ["src/ouncemcp"]
ignore_missing_imports = true
