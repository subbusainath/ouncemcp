name: Release

# Publishes to PyPI when a version tag (v1.0.0, v1.1.0rc1, ...) is pushed. Uses PyPI
# trusted publishing: no token is stored in the repository. One-time setup on PyPI
# and GitHub is in docs/maintainers/releasing.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $version" >&2
            exit 1
          fi
      - run: uv build
      - name: Smoke-test the wheel
        run: |
          uv venv /tmp/smoke
          VIRTUAL_ENV=/tmp/smoke uv pip install dist/*.whl
          /tmp/smoke/bin/ouncemcp --version
          /tmp/smoke/bin/python -c "import ouncemcp, sys; v = ouncemcp.__version__; print(v); sys.exit(0 if 'v' + v == '$GITHUB_REF_NAME' else 'ouncemcp.__version__ does not match the tag')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ouncemcp/
    permissions:
      id-token: write # trusted publishing: PyPI checks this workflow's identity
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv publish --trusted-publishing always dist/*
