name: Conformance

# Runs the official MCP conformance suite against the OunceMCP conformance target
# (src/ouncemcp/eval/conformance.py) for MCP 2026-07-28 (spec EVAL-1).
# Release gate 1: the job fails on any failure that is not in
# conformance/expected-failures.yml, and on baseline entries the suite reports as stale.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv venv
      - run: uv pip install -e ".[dev]"
      - name: Start the conformance target
        # The venv's Python directly, not `uv run`: a background `uv run` holds uv's cache
        # lock, and setup-uv's cache prune at the end of the job then times out.
        run: |
          .venv/bin/python -m ouncemcp.eval.conformance --port 3001 > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:3001/mcp; then exit 0; fi
            sleep 1
          done
          cat server.log
          exit 1
      - name: Run the conformance suite
        run: >
          npx --yes @modelcontextprotocol/conformance@0.2.0-alpha.12 server
          --url http://127.0.0.1:3001/mcp
          --spec-version 2026-07-28
          --expected-failures conformance/expected-failures.yml
          -o conformance-results
      - name: Stop the conformance target
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results
          path: |
            conformance-results
            server.log
