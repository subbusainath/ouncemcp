site_name: OunceMCP
site_description: Build MCP servers that are fast, low-noise and safe for agents by default.
repo_url: https://github.com/subbusainath/ouncemcp
site_url: !ENV [SITE_URL, "https://subbusainath.github.io/ouncemcp/"]
docs_dir: docs
strict: true
edit_uri: edit/main/docs/
repo_name: subbusainath/ouncemcp
copyright: OunceMCP contributors. Released under the Apache-2.0 license.
theme:
  name: material
  language: en
  font: false
  icon:
    repo: fontawesome/brands/github
  logo: assets/logo-icon-dark.png
  favicon: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/subbusainath/ouncemcp
      name: OunceMCP on GitHub
    - icon: fontawesome/brands/discord
      link: https://discord.gg/mQz4ZuZe3u
      name: OunceMCP Discord
extra_css:
  - assets/extra.css
