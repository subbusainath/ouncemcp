markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tasklist
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            filters: ["!^_"]
            merge_init_into_class: true
            show_signature_annotations: true
            separate_signature: true
